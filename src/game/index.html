<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survival Island - Nova Geração</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', sans-serif;
    }
    
    #game-container {
      width: 100vw;
      height: 100vh;
    }
    
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.5s;
    }
    
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .loader {
      width: 80px;
      height: 80px;
      border: 4px solid rgba(99, 102, 241, 0.2);
      border-top: 4px solid #6366f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    #loading h1 {
      color: #fff;
      margin-top: 30px;
      font-size: 28px;
      font-weight: 600;
    }
    
    #loading p {
      color: #9ca3af;
      margin-top: 10px;
      font-size: 16px;
    }
    
    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      pointer-events: none;
    }
    
    .ui-panel {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px 20px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 10px;
    }
    
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      pointer-events: none;
      z-index: 100;
    }
    
    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
    }
    
    #crosshair::before {
      width: 2px;
      height: 20px;
      left: 50%;
      transform: translateX(-50%);
    }
    
    #crosshair::after {
      width: 20px;
      height: 2px;
      top: 50%;
      transform: translateY(-50%);
    }
    
    #controls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 100;
      color: #fff;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader"></div>
    <h1>Carregando Ilha...</h1>
    <p id="loading-status">Inicializando Three.js...</p>
  </div>
  
  <div id="game-container"></div>
  
  <div id="crosshair"></div>
  
  <div id="ui">
    <div class="ui-panel">
      <strong>Survival Island</strong>
      <div style="margin-top: 8px; font-size: 12px; opacity: 0.8;">
        FPS: <span id="fps">0</span>
      </div>
    </div>
  </div>
  
  <div id="controls">
    WASD - Mover | Mouse - Olhar | Shift - Correr | Space - Pular
  </div>
  
  <script type="module" src="./main.js"></script>
</body>
</html>
